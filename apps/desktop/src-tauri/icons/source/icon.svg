<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    StarAt — "pick up (拾), put in order (序)".
    Loose fragments (captured material) drift in from the upper right,
    growing more solid as they approach, and settle into an aligned stack
    (organised, scheduled, actionable items). The amber fragment is the one
    being placed right now; the gap at the head of the top row is its slot.
    Source of every file in ../ — regenerate with:
      npm run tauri -- icon apps/desktop/src-tauri/icons/source/icon.svg
    (then delete the android/ and ios/ folders it also writes)
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#sheen)"/>

  <!-- fragments still drifting in: smaller and fainter the further out -->
  <rect x="628" y="138" width="64" height="64" rx="18" fill="#ffffff" fill-opacity="0.36" transform="rotate(32 660 170)"/>
  <rect x="438" y="196" width="88" height="88" rx="24" fill="#ffffff" fill-opacity="0.6" transform="rotate(-20 482 240)"/>

  <!-- the fragment being placed, hovering over its slot -->
  <rect x="240" y="300" width="112" height="112" rx="30" fill="#fbbf24" transform="rotate(10 296 356)"/>

  <!-- ordered stack; the top row leaves the slot open -->
  <rect x="400" y="476" width="388" height="96" rx="48" fill="#ffffff"/>
  <rect x="236" y="620" width="552" height="96" rx="48" fill="#ffffff" fill-opacity="0.88"/>
  <rect x="236" y="764" width="408" height="96" rx="48" fill="#ffffff" fill-opacity="0.72"/>
</svg>
