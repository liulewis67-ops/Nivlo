[package]
name = "asterjot-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "AsterJot desktop host (Composition Root)"

[lib]
name = "asterjot_desktop_lib"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
base64.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-updater.workspace = true
tauri-specta.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
chrono.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
zip.workspace = true
asterjot-common.workspace = true
asterjot-domain.workspace = true
asterjot-application.workspace = true
asterjot-storage.workspace = true
asterjot-capture.workspace = true
asterjot-workflow.workspace = true
asterjot-script.workspace = true
async-trait.workspace = true
asterjot-scheduler.workspace = true
asterjot-integrations.workspace = true
asterjot-platform.workspace = true
sys-locale = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
asterjot-platform-windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
asterjot-platform-macos.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
asterjot-platform-linux.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tauri = { workspace = true, features = ["test"] }
sqlx.workspace = true
tempfile.workspace = true
uuid.workspace = true
tracing-subscriber.workspace = true
asterjot-application = { workspace = true, features = ["testing"] }

[lints]
workspace = true
