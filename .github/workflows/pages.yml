name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: apps/landing
      - name: Deploy
        id: deployment
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            // Use the uploaded ID directly: artifact listing can return an empty result
            // immediately after a successful upload, even when the REST API sees it.
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw new Error('Missing Pages artifact ID');
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken(),
            });
            core.setOutput('page_url', deployment.page_url);
            const id = deployment.id || deployment.status_url?.split('/').pop() || context.sha;
            for (let attempt = 0; attempt < 120; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...context.repo, deployment_id: id,
              });
              core.info(`Pages deployment: ${data.status}`);
              if (data.status === 'succeed') return;
              if (['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(data.status)) {
                throw new Error(`Pages deployment failed: ${JSON.stringify(data)}`);
              }
            }
            throw new Error('Pages deployment timed out');
